[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-server"
version = "0.1.0"
description = "Blackbox: a flight recorder and control layer for AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
blackbox = "blackbox.cli:main"

[tool.setuptools]
packages = ["blackbox"]
